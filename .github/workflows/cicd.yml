name: end to end project
on:
  push:
    branches:
      - master
jobs:
  compile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: java --version
      - name: Build with maven
        run: mvn compile
  security-check:
    runs-on: self-hosted
    needs: compile
    steps:
      - uses: actions/checkout@v7
      - name: Trivy FS scan
        run: trivy fs --format table -o fs-report.json .
      
